<div class="app-window" id="WheelApp">
  <div class="app-header"><span class="app-title">🎡 Decision Wheel</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="wh">
      <canvas id="wh-cv" width="300" height="300" class="wh-cv"></canvas>
      <div id="wh-res" class="wh-res">Spin the wheel</div>
      <button id="wh-spin">Spin</button>
      <textarea id="wh-opts" placeholder="One option per line…"></textarea>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
